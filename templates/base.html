<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Server Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #050505;
            --bg-card: #0f0f0f;
            --bg-accent: rgba(255, 255, 255, 0.03);
            --primary: #4ade80;
            --primary-glow: rgba(74, 222, 128, 0.4);
            --secondary: #3b82f6;
            --danger: #f87171;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
            --radius-lg: 16px;
            --radius-md: 12px;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            background-image:
                radial-gradient(at 0% 0%, rgba(74, 222, 128, 0.05) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.05) 0px, transparent 50%);
            color: var(--text-main);
            margin: 0; padding: 0; min-height: 100vh;
            display: flex; flex-direction: column; overflow-x: hidden;
        }
        .layout { max-width: 1200px; margin: 0 auto; width: 100%; padding: 2rem; display: flex; flex-direction: column; gap: 2rem; }
        header { display: flex; justify-content: space-between; align-items: center; }
        .brand { display: flex; align-items: center; gap: 1rem; }
        .brand h1 { margin: 0; font-size: 1.5rem; font-weight: 800; letter-spacing: -0.025em; background: linear-gradient(to right, #fff, #94a3b8); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
        .status-pill { display: flex; align-items: center; gap: 0.6rem; padding: 0.5rem 1rem; background: var(--bg-card); border: 1px solid var(--border); border-radius: 9999px; font-size: 0.85rem; font-weight: 600; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); }
        .status-online .status-dot { background: var(--primary); box-shadow: 0 0 12px var(--primary-glow); }
        .status-offline .status-dot { background: var(--danger); }
        nav { display: flex; background: var(--bg-card); padding: 0.4rem; border-radius: var(--radius-md); border: 1px solid var(--border); align-self: flex-start; }
        .nav-link { padding: 0.6rem 1.2rem; border-radius: 8px; cursor: pointer; font-size: 0.9rem; font-weight: 500; color: var(--text-muted); transition: var(--transition); }
        .nav-link:hover { color: #fff; background: rgba(255, 255, 255, 0.05); }
        .nav-link.active { color: #fff; background: var(--bg-accent); box-shadow: inset 0 0 0 1px var(--border); }
        .tab-content { display: none; animation: fadeIn 0.3s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
        .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1.5rem; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2); }
        .card-header { margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: center; }
        .card h2 { margin: 0; font-size: 1.1rem; font-weight: 700; color: var(--text-main); }
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; }
        .stats-group { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .stat-card { background: var(--bg-accent); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 1.2rem; text-align: center; }
        .stat-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 0.5rem; }
        .stat-value { font-size: 1.5rem; font-weight: 800; font-variant-numeric: tabular-nums; }
        .console-box { background: #000; border-radius: var(--radius-md); border: 1px solid var(--border); display: flex; flex-direction: column; height: 400px; }
        .console-logs { flex: 1; padding: 1rem; font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; overflow-y: auto; color: #d1d5db; }
        .console-input-wrap { padding: 0.75rem; border-top: 1px solid var(--border); display: flex; gap: 0.5rem; }
        .console-input-wrap input { flex: 1; background: transparent; border: none; color: #fff; font-family: 'JetBrains Mono', monospace; outline: none; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-muted); margin-bottom: 0.4rem; }
        input[type="text"], input[type="number"], select { width: 100%; background: var(--bg-accent); border: 1px solid var(--border); border-radius: 8px; padding: 0.6rem 0.8rem; color: #fff; font-family: inherit; transition: var(--transition); }
        .btn { padding: 0.6rem 1.2rem; border-radius: 8px; font-weight: 600; cursor: pointer; border: none; transition: var(--transition); display: inline-flex; align-items: center; gap: 0.5rem; font-family: inherit; }
        .btn-primary { background: #fff; color: #000; }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-success { background: var(--primary); color: #000; }
        .properties-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
        .prop-item { display: flex; flex-direction: column; gap: 0.4rem; padding: 1rem; background: var(--bg-accent); border: 1px solid var(--border); border-radius: var(--radius-md); }
        .prop-item label { font-size: 0.85rem; font-weight: 600; color: var(--text-muted); }
        .gamerules-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1rem; }
        .rule-card { display: flex; justify-content: space-between; align-items: center; padding: 1rem; background: var(--bg-accent); border: 1px solid var(--border); border-radius: var(--radius-md); }
        .rule-info h4 { margin: 0; font-size: 0.9rem; }
        .rule-info p { margin: 0.2rem 0 0; font-size: 0.75rem; color: var(--text-muted); }
        .switch { position: relative; display: inline-block; width: 44px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--border); transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked+.slider { background-color: var(--primary); }
        input:checked+.slider:before { transform: translateX(22px); }
        .player-list { display: flex; flex-direction: column; gap: 0.5rem; }
        .player-row { display: flex; justify-content: space-between; align-items: center; padding: 0.8rem 1.2rem; background: var(--bg-accent); border-radius: var(--radius-md); }
        .player-name { display: flex; align-items: center; gap: 0.8rem; font-weight: 600; }
        .role-badge { font-size: 0.7rem; text-transform: uppercase; }
        .role-admin, .role-op { color: var(--primary); font-weight: 700; }
        .role-viewer { color: var(--text-muted); }
    </style>
</head>
<body>
    <div class="layout">
        {% block content %}{% endblock %}
    </div>
    {% block scripts %}{% endblock %}
</body>
</html>
