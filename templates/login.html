<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MC Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --card: #0f0f0f;
            --primary: #4ade80;
            --border: rgba(255, 255, 255, 0.1);
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-image: radial-gradient(circle at 50% 50%, rgba(74, 222, 128, 0.05), transparent);
        }
        .login-card {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 3rem;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        h1 { font-weight: 800; letter-spacing: -1px; margin-bottom: 0.5rem; }
        p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 2rem; }
        
        .ms-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: white;
            color: black;
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            margin-bottom: 1.5rem;
            transition: transform 0.2s;
        }
        .ms-btn:hover { transform: translateY(-2px); }
        
        .divider {
            display: flex;
            align-items: center;
            color: #444;
            margin: 1.5rem 0;
        }
        .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: #333; }
        .divider span { padding: 0 10px; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; }

        input {
            width: 100%;
            background: #1a1a1a;
            border: 1px solid #333;
            padding: 12px;
            border-radius: 8px;
            color: white;
            margin-bottom: 1rem;
            box-sizing: border-box;
        }
        .admin-btn {
            width: 100%;
            background: var(--primary);
            color: black;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>Dashboard Login</h1>
        <p>Choose a method to continue</p>

        <a href="{{ ms_url }}" class="ms-btn">
            <svg width="20" height="20" viewBox="0 0 23 23"><path fill="#f3f3f3" d="M0 0h11v11H0z"/><path fill="#f3f3f3" d="M12 0h11v11H12z"/><path fill="#f3f3f3" d="M0 12h11v23H0z"/><path fill="#f3f3f3" d="M12 12h11v23H12z"/></svg>
            Sign in with Microsoft
        </a>

        <div class="divider"><span>or local</span></div>

        <form method="POST">
            <input type="password" name="password" placeholder="Admin Password" required>
            <button type="submit" class="admin-btn">Login Locally</button>
        </form>
    </div>
</body>
</html>
